name: Test basic usage - latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
      - name: Assert cue-path output is set
        env:
          CUE_PATH: ${{ steps.action.outputs.cue-path }}
        run: |
          echo "cue-path: $CUE_PATH"
          if [ -z "$CUE_PATH" ]; then
            echo "FAIL: cue-path output is empty"
            exit 1
          fi
          echo "PASS: cue-path is set to '$CUE_PATH'"
      - name: Assert cue binary exists at reported path
        env:
          CUE_PATH: ${{ steps.action.outputs.cue-path }}
        run: |
          echo "Checking binary at: $CUE_PATH"
          if [ ! -f "$CUE_PATH" ]; then
            echo "FAIL: cue binary not found at '$CUE_PATH'"
            exit 1
          fi
          echo "PASS: cue binary exists"
      - name: Assert cue is on PATH and executable
        run: |
          if ! command -v cue >/dev/null 2>&1; then
            echo "FAIL: cue not found on PATH"
            exit 1
          fi
          echo "PASS: cue is on PATH"
          cue version
